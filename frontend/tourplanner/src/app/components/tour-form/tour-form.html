<body>  
      <div *ngIf="error()" class="toast error-toast">
        {{ error() }}
      </div>
    <section class="create-card">
       
        <div class="card-header">
          <div>
            <p class="small-label">Neue Tour</p>
            <h2>Tour hinzufügen</h2>
          </div>
        </div>


        <div class="form-row">
          <label>Name</label>
          <input type="text" placeholder="Tourname" [(ngModel)]="newTour.name" />
        </div>

        <div class="form-row">
          <label>Description</label>
          <input type="text" placeholder="Beschreibung" [(ngModel)]="newTour.description" />
        </div>

        <div class="form-row">
          <label>Kategorie</label>
          <select [(ngModel)]="newTour.transportType">
            <option>Bike</option>
            <option>Hike</option>
            <option>Running</option>
            <option>Vacation</option>
          </select>
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label>From</label>
            <!---->
            <input type="text" placeholder="Von (z.B. Wien)"  [(ngModel)]="newTour.from"/>
          </div>
          <div class="form-row">
            <label>To</label>
            <!--[(ngModel)]="to"-->
            <input type="text" placeholder="Nach (z.B. Graz)"  [(ngModel)]="newTour.to"/>
          </div>
        </div>

        <div class="form-row">
          <label>Estimated Time</label>
          <input type="number" placeholder="Geschätzte Dauer (Minuten)" [(ngModel)]="newTour.estimatedTime" />
        </div>
        <button class="primary-button" (click)="addTour()">Tour hinzufügen</button>
      </section>
<section class="list-section">
        <div class="section-header">
          <div>
            <h2>Touren</h2>
            <p class="section-hint">Bearbeite Einträge direkt oder lösche veraltete Touren.</p>
          </div>
        </div>

        <div class="tour-grid">
          <article *ngFor="let tour of tours()" class="tour-card">
            <ng-container *ngIf="editingTour?.id === tour.id; then editMode else viewMode"></ng-container>

            <ng-template #editMode>
              <div class="card-row" *ngIf="editingTour as currentEdit">
                <input type="text" [(ngModel)]="currentEdit.name" />
                <input type="text" [(ngModel)]="currentEdit.description" />
                <select [(ngModel)]="currentEdit.transportType">
                  <option>Bike</option>
                  <option>Hike</option>
                  <option>Running</option>
                  <option>Vacation</option>
                </select>
                <input type="text" [(ngModel)]="currentEdit.from" />
                <input type="text" [(ngModel)]="currentEdit.to" />
              </div>
              <div class="card-row" *ngIf="editingTour as currentEdit">
                <input type="number" min="0" [(ngModel)]="currentEdit.estimatedTime" />
              </div>
              <div class="card-actions">
                <button class="secondary-button" (click)="saveEdit()">Speichern</button>
                <button class="danger-button" (click)="cancelEdit()">Abbrechen</button>
              </div>
            </ng-template>

            <ng-template #viewMode>
              <div class="tour-title">{{ tour.name }}</div>
              <div class="tour-meta">{{ tour.transportType }} · {{ tour.from }} from · {{ tour.to }} to</div>
              <div class="card-actions">
                <button class="secondary-button" (click)="startEdit(tour)">Bearbeiten</button>
                <button class="danger-button" (click)="deleteTour(tour.id!)">Löschen</button>
              </div>
            </ng-template>
          </article>
        </div>
      </section>
</body>
